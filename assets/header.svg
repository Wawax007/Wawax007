<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.55" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#5C0000"/>
    </linearGradient>
  </defs>

  <rect width="900" height="200" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="198" rx="11" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.35"/>

  <!-- blinking REC, because the agent is always watched -->
  <g font-family="'Courier New', monospace" font-size="13" opacity="0.9">
    <circle cx="836" cy="28" r="4.5" fill="#ff1a1a">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="848" y="33" fill="#ff5555">REC</text>
  </g>

  <g>
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>

    <text x="450" y="98" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="46" fill="#D4AF37" letter-spacing="6">AGENT WAWAX007</text>

    <!-- gold hairline that draws itself -->
    <rect x="450" y="116" width="0" height="1.5" fill="#D4AF37" opacity="0.6">
      <animate attributeName="width" values="0;340" dur="1.6s" begin="0.6s" fill="freeze"/>
      <animate attributeName="x" values="450;280" dur="1.6s" begin="0.6s" fill="freeze"/>
    </rect>

    <text x="450" y="147" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#c9a227" letter-spacing="4">TOP SECRET // FOR YOUR EYES ONLY</text>
  </g>
</svg>
