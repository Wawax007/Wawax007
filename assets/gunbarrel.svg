<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230">
  <rect width="900" height="230" fill="#000000"/>

  <!-- walking trail of barrel dots -->
  <circle cx="100" cy="115" r="9" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="115" r="12" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" begin="0.35s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="115" r="15" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="460" cy="115" r="19" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" begin="1.05s" repeatCount="indefinite"/>
  </circle>

  <!-- the gun barrel -->
  <g transform="translate(680,115)">
    <!-- outer gold accent ring -->
    <circle r="98" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.55"/>

    <!-- rotating rifling -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      <g stroke="#c8c8c8" stroke-width="2" opacity="0.8">
        <line x1="0" y1="-92" x2="0" y2="-64"/>
        <line x1="46" y1="-79.7" x2="32" y2="-55.4"/>
        <line x1="79.7" y1="-46" x2="55.4" y2="-32"/>
        <line x1="92" y1="0" x2="64" y2="0"/>
        <line x1="79.7" y1="46" x2="55.4" y2="32"/>
        <line x1="46" y1="79.7" x2="32" y2="55.4"/>
        <line x1="0" y1="92" x2="0" y2="64"/>
        <line x1="-46" y1="79.7" x2="-32" y2="55.4"/>
        <line x1="-79.7" y1="46" x2="-55.4" y2="32"/>
        <line x1="-92" y1="0" x2="-64" y2="0"/>
        <line x1="-79.7" y1="-46" x2="-55.4" y2="-32"/>
        <line x1="-46" y1="-79.7" x2="-32" y2="-55.4"/>
        <line x1="23.8" y1="-88.9" x2="16.6" y2="-61.8"/>
        <line x1="65.1" y1="-65.1" x2="45.3" y2="-45.3"/>
        <line x1="88.9" y1="-23.8" x2="61.8" y2="-16.6"/>
        <line x1="88.9" y1="23.8" x2="61.8" y2="16.6"/>
        <line x1="65.1" y1="65.1" x2="45.3" y2="45.3"/>
        <line x1="23.8" y1="88.9" x2="16.6" y2="61.8"/>
        <line x1="-23.8" y1="88.9" x2="-16.6" y2="61.8"/>
        <line x1="-65.1" y1="65.1" x2="-45.3" y2="45.3"/>
        <line x1="-88.9" y1="23.8" x2="-61.8" y2="16.6"/>
        <line x1="-88.9" y1="-23.8" x2="-61.8" y2="-16.6"/>
        <line x1="-65.1" y1="-65.1" x2="-45.3" y2="-45.3"/>
        <line x1="-23.8" y1="-88.9" x2="-16.6" y2="-61.8"/>
      </g>
      <circle r="92" fill="none" stroke="#e8e8e8" stroke-width="3"/>
      <circle r="64" fill="none" stroke="#e8e8e8" stroke-width="3"/>
      <circle r="78" fill="none" stroke="#9a9a9a" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- white muzzle disc -->
    <circle r="56" fill="#ffffff"/>

    <!-- 007 in the barrel -->
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="42" fill="#000000">007</text>

    <!-- blood wash dripping down inside the disc -->
    <clipPath id="muzzle">
      <circle r="56"/>
    </clipPath>
    <g clip-path="url(#muzzle)">
      <rect x="-60" y="-180" width="120" height="120" fill="#8B0000" opacity="0.88">
        <animate attributeName="y" values="-180;-180;-60;-60;-180" keyTimes="0;0.45;0.62;0.93;0.94" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
