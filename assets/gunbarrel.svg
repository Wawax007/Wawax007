<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <g transform="translate(120,120)">
    <!-- dark backing disc so the barrel reads on light AND dark GitHub themes -->
    <circle r="119" fill="#0d1117"/>

    <!-- outer gold accent ring -->
    <circle r="112" fill="none" stroke="#D4AF37" stroke-width="2.5" opacity="0.7"/>

    <!-- rotating rifling -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      <g stroke="#c8c8c8" stroke-width="2.5" opacity="0.85">
        <line x1="0" y1="-104" x2="0" y2="-74"/>
        <line x1="52" y1="-90.1" x2="37" y2="-64.1"/>
        <line x1="90.1" y1="-52" x2="64.1" y2="-37"/>
        <line x1="104" y1="0" x2="74" y2="0"/>
        <line x1="90.1" y1="52" x2="64.1" y2="37"/>
        <line x1="52" y1="90.1" x2="37" y2="64.1"/>
        <line x1="0" y1="104" x2="0" y2="74"/>
        <line x1="-52" y1="90.1" x2="-37" y2="64.1"/>
        <line x1="-90.1" y1="52" x2="-64.1" y2="37"/>
        <line x1="-104" y1="0" x2="-74" y2="0"/>
        <line x1="-90.1" y1="-52" x2="-64.1" y2="-37"/>
        <line x1="-52" y1="-90.1" x2="-37" y2="-64.1"/>
        <line x1="26.9" y1="-100.5" x2="19.2" y2="-71.5"/>
        <line x1="73.5" y1="-73.5" x2="52.3" y2="-52.3"/>
        <line x1="100.5" y1="-26.9" x2="71.5" y2="-19.2"/>
        <line x1="100.5" y1="26.9" x2="71.5" y2="19.2"/>
        <line x1="73.5" y1="73.5" x2="52.3" y2="52.3"/>
        <line x1="26.9" y1="100.5" x2="19.2" y2="71.5"/>
        <line x1="-26.9" y1="100.5" x2="-19.2" y2="71.5"/>
        <line x1="-73.5" y1="73.5" x2="-52.3" y2="52.3"/>
        <line x1="-100.5" y1="26.9" x2="-71.5" y2="19.2"/>
        <line x1="-100.5" y1="-26.9" x2="-71.5" y2="-19.2"/>
        <line x1="-73.5" y1="-73.5" x2="-52.3" y2="-52.3"/>
        <line x1="-26.9" y1="-100.5" x2="-19.2" y2="-71.5"/>
      </g>
      <circle r="104" fill="none" stroke="#e8e8e8" stroke-width="3.5"/>
      <circle r="74" fill="none" stroke="#e8e8e8" stroke-width="3.5"/>
      <circle r="89" fill="none" stroke="#9a9a9a" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- dark backing so the disc reads on light AND dark GitHub themes -->
    <circle r="70" fill="#0d1117"/>

    <!-- white muzzle disc -->
    <circle r="64" fill="#ffffff"/>

    <!-- 007 in the barrel -->
    <text x="0" y="16" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="46" fill="#000000">007</text>

    <!-- blood wash dripping down inside the disc -->
    <clipPath id="muzzle">
      <circle r="64"/>
    </clipPath>
    <g clip-path="url(#muzzle)">
      <rect x="-68" y="-200" width="136" height="136" fill="#8B0000" opacity="0.88">
        <animate attributeName="y" values="-200;-200;-68;-68;-200" keyTimes="0;0.45;0.62;0.93;0.94" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
